---
layout: default
---
<main id="main" class="academic-page{% if page.empty_section %} academic-page--empty{% endif %}">
  <header class="academic-page__header">
    <p class="eyebrow">Peng Huang <span>/</span> Peking University</p>
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="academic-page__intro">{{ page.intro }}</p>{% endif %}
  </header>
  <div class="academic-page__content">{{ content }}</div>
</main>
