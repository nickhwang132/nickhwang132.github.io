name: Jekyll build (validation only)
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
      - run: bundle exec jekyll build --safe --strict_front_matter
        env:
          JEKYLL_ENV: production
      - run: bundle exec ruby scripts/verify.rb
