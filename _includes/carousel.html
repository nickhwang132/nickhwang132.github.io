{% assign slides = site.data.news.news %}
{% if slides and slides.size > 0 %}
<div class="group-gallery" role="region" aria-roledescription="carousel" aria-label="Group photographs" data-gallery>
  <div class="group-gallery__slides">
    {% for slide in slides %}
    {% assign stem = slide.image | split: '/' | last | split: '.' | first %}
    <figure class="group-gallery__slide">
      <img src="{{ slide.image | relative_url }}" srcset="{{ '/images/generated/news/' | append: stem | append: '-960.jpg' | relative_url }} 960w, {{ '/images/generated/news/' | append: stem | append: '-1600.jpg' | relative_url }} 1600w" sizes="(max-width: 900px) 100vw, 430px" alt="{{ slide.alt | escape }}" width="{{ slide.width }}" height="{{ slide.height }}" loading="lazy" decoding="async">
      <figcaption>{{ slide.caption }}</figcaption>
    </figure>
    {% endfor %}
  </div>
  <div class="gallery-controls" hidden><button type="button" data-gallery-prev aria-label="Previous photograph">←</button><span data-gallery-count role="status" aria-live="polite"></span><button type="button" data-gallery-next aria-label="Next photograph">→</button></div>
</div>
{% endif %}
