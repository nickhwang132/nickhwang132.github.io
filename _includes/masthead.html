{% include base_path %}
<header class="academic-header">
  <div class="academic-header__inner">
    <a class="academic-brand" href="{{ base_path }}/" aria-label="Peng Huang — home">Peng Huang <span lang="zh-CN">黄鹏</span></a>
    <nav class="academic-nav" aria-label="Main navigation">
      {% for link in site.data.navigation.main %}
        <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
