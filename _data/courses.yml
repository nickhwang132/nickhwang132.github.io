      "description": "An introduction to the history, foundations and future of microelectronics. The course connects semiconductor physics and device operation with integrated circuit manufacturing and design. Students develop an overview of the field, from transistors and fabrication processes to computer-aided design, optoelectronics and microelectromechanical systems.",
